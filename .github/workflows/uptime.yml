name: Uptime

# Checks the live site and API every 10 minutes. A failing run makes GitHub email the repository owner,
# so an outage does not go unnoticed.
#
# It also keeps the API warm: Render's free plan puts the service to sleep after 15 idle minutes, and the
# next visitor would wait 20 to 30 seconds for it to wake. GitHub runs scheduled jobs on a best-effort basis
# (they can be late), so treat this as a safety net, not a guarantee.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    name: Check production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: https://venurebackend.onrender.com
      SITE_URL: https://venure.aaryanbasnet.com.np
    steps:
      # A sleeping Render free service answers 502 for 30 to 60+ seconds while it wakes up. Retry on any error for up to
      # four minutes, so a cold start counts as slow, not down (the old three tries in 45 seconds reported it as an outage).
      - name: API is alive
        run: curl --fail --silent --show-error --max-time 60 --retry 12 --retry-delay 10 --retry-max-time 240 --retry-all-errors "$API_URL/api/health"

      - name: API can reach the database
        run: curl --fail --silent --show-error --max-time 30 --retry 6 --retry-delay 10 --retry-max-time 120 --retry-all-errors "$API_URL/api/ready"

      - name: Website loads
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 6 --retry-delay 10 --retry-max-time 120 --retry-all-errors "$SITE_URL/" \
            | grep -q '<div id="root">'
